name = "outcry-api"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated site origins allowed to call the API.
ALLOWED_ORIGINS = "https://tahire29-spec.github.io"

[[d1_databases]]
binding = "DB"
database_name = "outcry"
# database_id is filled in by `npm run d1:create` (see README).
database_id = "00000000-0000-0000-0000-000000000000"
