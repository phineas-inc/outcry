name = "outcry-api"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated site origins allowed to call the API.
ALLOWED_ORIGINS = "https://phineas-inc.github.io,https://outcry.tanishqahire.com"

[[d1_databases]]
binding = "DB"
database_name = "outcry"
# database_id is filled in by `npm run d1:create` (see README).
database_id = "eccd2154-fb48-4f62-b0bd-4982f2fe2805"

# Workers AI (free daily allowance) classifies headlines and writes neutral summaries.
[ai]
binding = "AI"

# One stage per trigger keeps each run inside the free plan's CPU limit. Keep in sync with STAGE_BY_CRON in src/worker.ts.
[triggers]
crons = ["5 * * * *", "12 * * * *", "20,50 * * * *", "35 * * * *"]
