<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try { var t = localStorage.getItem("outcry.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
      try { var l = localStorage.getItem("outcry.lang") || (navigator.language || "en"); document.documentElement.lang = l.slice(0, 2) === "de" ? "de" : "en"; } catch (e) {}
    </script>
    <meta name="description" content="Outcry tracks protests worldwide, shows how the media spectrum covers them, and lets you weigh in with a daily budget of Voice." />
    <meta property="og:title" content="Outcry — See every side of every movement" />
    <meta property="og:description" content="Live protests worldwide, and how left, center and right media cover each one." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tahire29-spec.github.io/outcry/" />
    <meta property="og:site_name" content="Outcry" />
    <meta property="og:image" content="https://tahire29-spec.github.io/outcry/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Outcry: a dark world map with glowing protest markers and the headline See every side of every movement." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Outcry — See every side of every movement" />
    <meta name="twitter:description" content="Live protests worldwide, and how left, center and right media cover each one." />
    <meta name="twitter:image" content="https://tahire29-spec.github.io/outcry/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Outcry — See every side of every movement</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
