name: Deploy website
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # 404.html is the SPA fallback for deep links; real copies of index.html for the fixed pages make them return 200 (better for link previews and crawlers).
      - run: |
          npm ci && npm run build
          cp dist/index.html dist/404.html
          for route in feed about me privacy accessibility; do mkdir -p "dist/$route" && cp dist/index.html "dist/$route/index.html"; done
        working-directory: web
        env:
          # To serve from a custom domain at the root, set repo variables SITE_BASE=/ and SITE_URL=https://your.domain/
          VITE_BASE: ${{ vars.SITE_BASE || '/outcry/' }}
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://phineas-inc.github.io/outcry/' }}
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
