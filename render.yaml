# One-click backend deploy: https://render.com/deploy?repo=https://github.com/tahire29-spec/outcry
services:
  - type: web
    name: outcry-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    disk: { name: outcry-data, mountPath: /data, sizeGB: 1 }
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://tahire29-spec.github.io
